version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: educonnect_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-educonnect_db}
      POSTGRES_USER: ${POSTGRES_USER:-educonnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educonnect_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educonnect -d educonnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & WebSocket Message Broker
  redis:
    image: redis:7-alpine
    container_name: educonnect_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Django Web API & ASGI WebSocket Server
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: educonnect_backend
    restart: always
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/seed_data.py &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-educonnect}:${POSTGRES_PASSWORD:-educonnect_secret}@db:5432/${POSTGRES_DB:-educonnect_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-change-this-now-1234567890}
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GUARDIAN_SECRET_TOKEN=${GUARDIAN_SECRET_TOKEN:-guardian-secure-internal-auth-token-change-in-prod}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/backend/media

  # 4. Celery Asynchronous Worker
  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: educonnect_celery
    restart: always
    command: celery -A config worker -l info
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-educonnect}:${POSTGRES_PASSWORD:-educonnect_secret}@db:5432/${POSTGRES_DB:-educonnect_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-prod-secret-key-change-this-now-1234567890}
    depends_on:
      - backend
      - redis

  # 5. Independent AI Guardian Watchdog Service
  guardian:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.guardian
    container_name: educonnect_guardian
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
      - GUARDIAN_SECRET_TOKEN=${GUARDIAN_SECRET_TOKEN:-guardian-secure-internal-auth-token-change-in-prod}
      - GUARDIAN_POLL_INTERVAL_SECONDS=15
      - GUARDIAN_AI_AUTO_RECOVERY=True
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - backend

  # 6. React Web Application (Production NGINX)
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: educonnect_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_volume:
