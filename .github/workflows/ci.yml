name: EduConnect AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-guardian-tests:
    name: Backend & AI Guardian Automated Test Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend & Guardian Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ai_guardian/requirements.txt

      - name: Run Django Migrations & Health Verification
        env:
          SECRET_KEY: ci-test-secret-key-educonnect-12345
          DEBUG: "True"
          USE_SQLITE_FALLBACK: "True"
        run: |
          python backend/manage.py migrate
          python backend/manage.py check

      - name: Execute Django Unit & API Tests
        env:
          SECRET_KEY: ci-test-secret-key-educonnect-12345
          DEBUG: "True"
          USE_SQLITE_FALLBACK: "True"
        run: |
          python backend/manage.py test apps.accounts apps.social

      - name: Execute AI Guardian Autonomous Reliability Tests
        run: |
          python tests/guardian/test_guardian_probes.py

      - name: Execute End-to-End Student Workflow Tests
        env:
          SECRET_KEY: ci-test-secret-key-educonnect-12345
          DEBUG: "True"
          USE_SQLITE_FALLBACK: "True"
        run: |
          python tests/e2e/test_student_workflow.py

  frontend-build:
    name: Frontend Compilation & Asset Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Build React Production Bundle
        run: npm --prefix frontend run build
