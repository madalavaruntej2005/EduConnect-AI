# ==============================================================================
# EduConnect AI - Render Production Blueprint Specification
# ==============================================================================

databases:
  - name: educonnect-postgres
    databaseName: educonnect_db
    user: educonnect
    plan: standard
    region: oregon

services:
  # 1. Django Web Service (REST API & WebSockets)
  - type: web
    name: educonnect-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py collectstatic --noinput && python backend/manage.py migrate"
    startCommand: "gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://educonnect-frontend.onrender.com"
      - key: REDIS_URL
        fromService:
          type: redis
          name: educonnect-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: GUARDIAN_SECRET_TOKEN
        generateValue: true

  # 2. Redis Cache & WebSocket Broker
  - type: redis
    name: educonnect-redis
    region: oregon
    plan: standard
    maxmemoryPolicy: allkeys-lru

  # 3. Celery Background Worker
  - type: worker
    name: educonnect-celery-worker
    env: python
    region: oregon
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "celery --workdir backend -A config worker -l info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: educonnect-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: educonnect-redis
          property: connectionString

  # 4. Independent AI Guardian Watchdog Service
  - type: worker
    name: educonnect-ai-guardian
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r ai_guardian/requirements.txt"
    startCommand: "python ai_guardian/guardian_daemon.py"
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: educonnect-backend
          property: host
      - key: GUARDIAN_SECRET_TOKEN
        fromService:
          type: web
          name: educonnect-backend
          property: envVar:GUARDIAN_SECRET_TOKEN
      - key: GUARDIAN_POLL_INTERVAL_SECONDS
        value: "20"
      - key: GUARDIAN_AI_AUTO_RECOVERY
        value: "True"
      - key: OPENAI_API_KEY
        sync: false

  # 5. React Web Frontend (Static Site)
  - type: web
    name: educonnect-frontend
    env: static
    region: oregon
    plan: starter
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: educonnect-backend
          property: host
          path: /api/v1
      - key: VITE_APP_NAME
        value: "EduConnect AI"
